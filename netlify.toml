[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Only public client configuration may be excluded from value scanning.
  # Firebase client API keys/project IDs identify the app; they are not admin credentials.
  # Never add OPENXBL_API_KEY, IGDB_CLIENT_SECRET, TWITCH_CLIENT_SECRET or session secrets here.
  SECRETS_SCAN_OMIT_KEYS = "GALAXIA_FIREBASE_PROJECT,FIREBASE_API_KEY,FIREBASE_PROJECT_ID,VITE_YOUTUBE_CHANNEL_ID,VITE_YOUTUBE_API_KEY,VITE_SOCKET_URL,VITE_YOUTUBE_HANDLE,VITE_SITE_URL"
  VITE_SITE_URL = "https://galaxianintendera.com"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo-files?type=sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/seo-files?type=robots"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
