[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Firebase web configuration is public and is embedded by Vite in the browser bundle.
  # Keep scanning enabled for private server credentials.
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_API_KEY,FIREBASE_PROJECT_ID,FIREBASE_AUTH_DOMAIN,FIREBASE_STORAGE_BUCKET,FIREBASE_MESSAGING_SENDER_ID,FIREBASE_APP_ID,VITE_FIREBASE_API_KEY,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,GALAXIA_FIREBASE_PROJECT,VITE_YOUTUBE_CHANNEL_ID,VITE_YOUTUBE_API_KEY,VITE_SOCKET_URL,VITE_YOUTUBE_HANDLE,VITE_SITE_URL,IGDB_CLIENT_ID,TWITCH_CLIENT_ID"
  VITE_SITE_URL = "https://galaxianintendera.com"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/seo-files?type=sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/seo-files?type=robots"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
